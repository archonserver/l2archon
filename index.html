<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>www.12archon.gr — Κάτι εξαιρετικό έρχεται</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .domain {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: lowercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #ffffff;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="domain">www.L2Archon.gr</div>
    <h1>Κάτι εξαιρετικό έρχεται</h1>
    <p>Ετοιμάζουμε κάτι ξεχωριστό. Μείνετε συντονισμένοι — θα είμαστε κοντά σας πολύ σύντομα.</p>
    <div class="badge">
      <span class="dot"></span>
      <span>Προσεχώς</span>
    </div>
  </div>
</body>
</html>
